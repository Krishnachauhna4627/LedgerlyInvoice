<div class="mobile-bar">
  <button type="button" class="icon-btn" aria-label="Open menu" aria-controls="app-sidebar" [attr.aria-expanded]="menuOpen()" (click)="menuOpen.set(true)">
    <app-icon name="menu" [size]="22" />
  </button>
  <a class="brand" routerLink="/dashboard">
    <app-logo-mark [size]="32" />
    <span class="brand__name">Ledgerly</span>
  </a>
</div>

@if (menuOpen()) {
  <div class="backdrop" (click)="menuOpen.set(false)" aria-hidden="true"></div>
}

<aside id="app-sidebar" class="sidebar" [class.sidebar--open]="menuOpen()">
  <div class="sidebar__head">
    <a class="brand" routerLink="/dashboard">
      <app-logo-mark [size]="32" />
      <span class="brand__name">Ledgerly</span>
    </a>
    <button type="button" class="icon-btn close" aria-label="Close menu" (click)="menuOpen.set(false)">
      <app-icon name="x" [size]="20" />
    </button>
  </div>

  <nav class="nav" aria-label="Main">
    @for (item of nav; track item.path) {
      <a class="nav__link" [routerLink]="item.path" routerLinkActive="active">
        <app-icon [name]="item.icon" [size]="18" />
        <span>{{ item.label }}</span>
        @if (item.path === '/invoices' && invoiceCount() > 0) {
          <span class="nav__badge">{{ invoiceCount() }}</span>
        }
      </a>
    }
  </nav>

  @if (user(); as user) {
    <div class="account">
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
      <span class="account__text">
        <span class="account__name">{{ user.name }}</span>
        <span class="account__company">{{ user.company.name }}</span>
      </span>
      <button type="button" class="icon-btn" aria-label="Log out" title="Log out" (click)="logout()">
        <app-icon name="log-out" [size]="18" />
      </button>
    </div>
  }
</aside>

<div class="content">
  <router-outlet />
</div>

<app-toast-host />
