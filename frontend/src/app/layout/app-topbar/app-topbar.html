<div class="container bar">
  <a class="brand" routerLink="/dashboard">
    <app-logo-mark [size]="36" />
    <span class="brand__name">Ledgerly Invoices</span>
  </a>

  <div class="account">
    @if (user(); as user) {
      <div class="who">
        <span class="who__name">{{ user.name }}</span>
        <span class="who__company">{{ user.company.name }}</span>
      </div>
      <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    }
    <button type="button" class="logout" (click)="logout()" aria-label="Log out">
      <app-icon name="log-out" [size]="18" />
      <span class="logout__label">Log out</span>
    </button>
  </div>
</div>
