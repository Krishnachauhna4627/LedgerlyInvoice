<h2 class="sr-only">Summary</h2>
<ul class="grid">
  @for (stat of stats; track stat.label) {
    <li class="card">
      <span class="icon"><app-icon [name]="stat.icon" [size]="20" /></span>
      <span class="label">{{ stat.label }}</span>
      <span class="value">{{ stat.value }}</span>
    </li>
  }
</ul>
