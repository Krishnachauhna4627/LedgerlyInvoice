<app-topbar />

<main class="container page">
  <header class="welcome">
    <div>
      <p class="company">{{ companyName() }}</p>
      <h1>Welcome, {{ firstName() }}</h1>
      <p class="lead">Here's an overview of your business.</p>
    </div>
    <button type="button" class="btn btn--primary" disabled title="Coming soon">
      <app-icon name="plus" [size]="18" /> New invoice
    </button>
  </header>

  <app-stat-cards />

  <div class="grid">
    <app-recent-invoices />
    <app-quick-actions />
  </div>
</main>
