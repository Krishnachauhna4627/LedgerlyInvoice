<app-page-header title="Dashboard" [subtitle]="subtitle()">
  <a class="btn btn--primary btn--sm" routerLink="/invoices/new"><app-icon name="plus" [size]="16" /> Create Invoice</a>
</app-page-header>

<div class="page-body">
  @if (error()) {
    <div class="panel empty-state">
      <p class="empty-state__title">Couldn't load your dashboard</p>
      <p>{{ error() }}</p>
      <button type="button" class="btn btn--outline btn--sm" (click)="load()">Try again</button>
    </div>
  } @else if (summary(); as s) {
    <app-stat-tiles [summary]="s" />

    <div class="grid" [class.grid--single]="setupDone()">
      <app-recent-invoices [invoices]="s.recentInvoices" />
      @if (!setupDone()) {
        <app-get-started [steps]="steps()" />
      }
    </div>
  } @else if (loading()) {
    <div class="panel empty-state"><p>Loading your dashboard…</p></div>
  }
</div>
