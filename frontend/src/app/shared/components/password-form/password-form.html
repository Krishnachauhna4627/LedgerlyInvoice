<form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error()) {
    <div class="form-alert" role="alert">{{ error() }}</div>
  }

  <!-- Lets password managers tie the new password to this account. -->
  <input type="text" name="username" autocomplete="username" [value]="username" hidden />

  <div class="field">
    <label class="field__label" for="password-current">Current password *</label>
    <input id="password-current" class="input" type="password" formControlName="currentPassword" autocomplete="current-password"
      [class.is-invalid]="errorFor('currentPassword')" [attr.aria-invalid]="!!errorFor('currentPassword')" aria-describedby="password-current-error" />
    @if (errorFor('currentPassword'); as message) {
      <span id="password-current-error" class="field__error">{{ message }}</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="password-new">New password *</label>
    <input id="password-new" class="input" type="password" formControlName="newPassword" autocomplete="new-password"
      [class.is-invalid]="errorFor('newPassword')" [attr.aria-invalid]="!!errorFor('newPassword')" aria-describedby="password-new-error" />
    @if (errorFor('newPassword'); as message) {
      <span id="password-new-error" class="field__error">{{ message }}</span>
    } @else {
      <span id="password-new-error" class="hint">At least 8 characters.</span>
    }
  </div>

  <div class="field">
    <label class="field__label" for="password-confirm">Confirm new password *</label>
    <input id="password-confirm" class="input" type="password" formControlName="confirmPassword" autocomplete="new-password"
      [class.is-invalid]="errorFor('confirmPassword')" [attr.aria-invalid]="!!errorFor('confirmPassword')" aria-describedby="password-confirm-error" />
    @if (errorFor('confirmPassword'); as message) {
      <span id="password-confirm-error" class="field__error">{{ message }}</span>
    }
  </div>

  <div class="actions">
    <button type="button" class="btn btn--outline" (click)="cancelled.emit()">Back</button>
    <button type="submit" class="btn btn--primary" [disabled]="submitting()">
      {{ submitting() ? 'Saving…' : 'Change password' }}
    </button>
  </div>
</form>
